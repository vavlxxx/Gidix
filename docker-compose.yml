services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: gidix-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gidix}
      POSTGRES_USER: ${POSTGRES_USER:-gidix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gidix_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gidixnet
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gidix} -d ${POSTGRES_DB:-gidix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://gidix:gidix_password@postgres:5432/gidix}
      CORS_ORIGINS: ${PUBLIC_APP_URL:-http://localhost:3000},http://localhost:5173
    volumes:
      - ./backend/app/media:/app/app/media
      - ./backend/logs:/app/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gidixnet
    ports:
      - "${API_PORT:-8000}:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE: ${PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    networks:
      - gidixnet
    ports:
      - "${APP_PORT:-3000}:5173"

  osrm:
    image: osrm/osrm-backend:latest
    profiles: ["osrm"]
    container_name: gidix-osrm-bashkortostan
    volumes:
      - ./osrm:/data
    command: >
      osrm-routed
      --algorithm mld
      --max-table-size 1000
      --max-trip-size 1000
      /data/bashkortostan_republic.osrm
    networks:
      - gidixnet
    ports:
      - "5000:5000"

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    container_name: gidix-ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - gidixnet
    ports:
      - "11434:11434"

volumes:
  postgres_data:
  frontend_node_modules:
  ollama_data:

networks:
  gidixnet:
    driver: bridge
